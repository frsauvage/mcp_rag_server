name: rag_query
description: Prompt RAG pour répondre à une question sur la codebase
template: |
  Tu es un expert en analyse de code (Python et C++).
  Voici des extraits de code pertinents issus de la codebase :

  {context}

  ---
  Question : {question}

  Réponds précisément en t'appuyant sur les extraits fournis.
  Cite les fichiers et les noms de symboles concernés.
