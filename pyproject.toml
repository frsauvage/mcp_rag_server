[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-rag-server"
version = "2.2.0"
description = "Serveur MCP avec RAG complet sur codebase Python/C++ (chunking syntaxique, ChromaDB, mistral-embed)"
requires-python = ">=3.11"

dependencies = [
    # MCP
    "mcp",

    # LangChain + Mistral
    "langchain-openai",
    
    # ChromaDB (base vectorielle avec persistance SQLite)
    "chromadb",

    # Chunking C++
    "tree-sitter",
    "tree-sitter-cpp",
    "pymupdf",

    # Utilitaires
    "python-dotenv",

    "pydantic",
    "openai",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "jupyter",
]

# Indique à setuptools que le projet est un répertoire de scripts plats
# (pas de package Python structuré avec __init__.py)
[tool.setuptools]
py-modules = [
    "chunker",
    "embedder",
    "indexer",
    "mcp_rag_server",
    "mcp_rag_client_llm",
    "chunker_pdf",
    "prompts",
    "retriever",
    "store",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
